<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Char Builder</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Build your Hero!</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="characters.html">Characters</a>
        <a href="soundtrack.html">Soundtrack</a>
        <a href="builder.html">Char Builder</a>
      </nav>
    </header>

    <form action="" class="forms">
      <div>
        <label for="insert_name">Name:</label>
        <input
          type="text"
          name="char_name"
          id="insert_name"
          placeholder="Ex: Aragorn"
        />
      </div>
      <div>
        <label for="class_select">Pick a class:</label>
        <select name="Class" id="class_select">
          <option disabled selected value="">Class</option>
          <option value="opt1">Warrior</option>
          <option value="opt2">Mage</option>
          <option value="opt3">Orc</option>
          <option value="opt4">Archer</option>
        </select>
      </div>
      <button type="submit">Finish</button>
    </form>
    <script src="js/script.js"></script>
  </body>
</html>
